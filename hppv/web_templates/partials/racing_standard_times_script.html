<script>
(function () {
  const root = document.getElementById("racing-info-root");
  if (!root) return;
  const panel = document.getElementById("racing-tab-panel-standard_times");
  if (!panel) return;
  if (!window.HppvRecordsShell || !window.HppvRecordsHeader || !window.HppvLayoutEditor) {
    throw new Error("racing standard times requires records shell + layout editor");
  }
  const RH = window.HppvRecordsHeader;
  const WIDTH_MIN = 60;
  const WIDTH_MAX = 600;
  const MSG = {
    loading: {{ t('racing.standard_times.loading')|tojson }},
    empty: {{ t('racing.standard_times.empty')|tojson }},
    error: {{ t('racing.standard_times.error')|tojson }},
    retry: {{ t('racing.standard_times.retry')|tojson }},
    layoutSaved: {{ t('soccer.daily.layout.saved')|tojson }},
    layoutSaveFailed: {{ t('soccer.daily.layout.save_failed')|tojson }},
    layoutSortEmpty: {{ t('soccer.daily.layout.sort_empty')|tojson }},
    layoutSortAsc: {{ t('soccer.daily.layout.sort_asc')|tojson }},
    layoutSortDesc: {{ t('soccer.daily.layout.sort_desc')|tojson }},
    sortUnsupported: {{ t('racing.history.layout.sort_unsupported')|tojson }},
    layoutMoveUp: {{ t('soccer.daily.layout.move_up')|tojson }},
    layoutMoveDown: {{ t('soccer.daily.layout.move_down')|tojson }},
    layoutWidthInvalid: {{ t('soccer.daily.layout.width_invalid')|tojson }},
  };
  const COL_LABEL = {
    published_on: {{ t('racing.standard_times.col.published_on')|tojson }},
    source_year: {{ t('racing.standard_times.col.source_year')|tojson }},
    venue_code: {{ t('racing.standard_times.col.venue_code')|tojson }},
    track_type: {{ t('racing.standard_times.col.track_type')|tojson }},
    distance_m: {{ t('racing.standard_times.col.distance_m')|tojson }},
    class_band: {{ t('racing.standard_times.col.class_band')|tojson }},
    standard_time: {{ t('racing.standard_times.col.standard_time')|tojson }},
    sec_1: {{ t('racing.standard_times.col.sec_1')|tojson }},
    sec_2: {{ t('racing.standard_times.col.sec_2')|tojson }},
    sec_3: {{ t('racing.standard_times.col.sec_3')|tojson }},
    sec_4: {{ t('racing.standard_times.col.sec_4')|tojson }},
    sec_5: {{ t('racing.standard_times.col.sec_5')|tojson }},
    sec_6: {{ t('racing.standard_times.col.sec_6')|tojson }},
    id: {{ t('racing.standard_times.col.id')|tojson }},
  };
  const COL_DESC = {
    published_on: {{ t('racing.standard_times.col.desc.published_on')|tojson }},
    source_year: {{ t('racing.standard_times.col.desc.source_year')|tojson }},
    venue_code: {{ t('racing.standard_times.col.desc.venue_code')|tojson }},
    track_type: {{ t('racing.standard_times.col.desc.track_type')|tojson }},
    distance_m: {{ t('racing.standard_times.col.desc.distance_m')|tojson }},
    class_band: {{ t('racing.standard_times.col.desc.class_band')|tojson }},
    standard_time: {{ t('racing.standard_times.col.desc.standard_time')|tojson }},
    sec_1: {{ t('racing.standard_times.col.desc.sec_1')|tojson }},
    sec_2: {{ t('racing.standard_times.col.desc.sec_2')|tojson }},
    sec_3: {{ t('racing.standard_times.col.desc.sec_3')|tojson }},
    sec_4: {{ t('racing.standard_times.col.desc.sec_4')|tojson }},
    sec_5: {{ t('racing.standard_times.col.desc.sec_5')|tojson }},
    sec_6: {{ t('racing.standard_times.col.desc.sec_6')|tojson }},
    id: {{ t('racing.standard_times.col.desc.id')|tojson }},
  };
  const ZEBRA_COLORS = {{ layout_zebra_colors|tojson }};
  let layoutSaved = {{ racing_std_layout_settings|tojson }};
  let layoutDraft = JSON.parse(JSON.stringify(layoutSaved));
  let catalog = {{ (racing_std_layout_catalog if racing_std_layout_catalog is defined else [])|tojson }};
  let listCtrl = null;
  let layoutEditor = null;
  let loaded = false;
  let layoutModeOpen = false;
  const SORTABLE = {};

  const stateBox = document.getElementById("racing-std-state");
  const tableWrap = document.getElementById("racing-std-table-wrap");
  const thead = document.getElementById("racing-std-thead");
  const tbody = document.getElementById("racing-std-tbody");
  const searchInput = document.getElementById("racing-std-search");
  const searchOp = document.getElementById("racing-std-search-op");
  const pagerStatus = document.getElementById("racing-std-pager-status");
  const allRecords = document.getElementById("racing-std-all-records");
  const dateInput = document.getElementById("racing-std-date");
  const btnPrevDay = document.getElementById("racing-std-btn-prev-day");
  const btnNextDay = document.getElementById("racing-std-btn-next-day");

  function rebuildSortable() {
    Object.keys(SORTABLE).forEach(function (k) { delete SORTABLE[k]; });
    ((layoutSaved && layoutSaved.columns) || []).forEach(function (c) {
      SORTABLE[c.key] = true;
    });
    (catalog || []).forEach(function (c) {
      SORTABLE[c.key] = !!c.sortable;
    });
  }

  function applyZebraCss() {
    const id = (layoutSaved && layoutSaved.zebra_color_id) || "default";
    const hit = (ZEBRA_COLORS || []).find(function (z) { return z.id === id; });
    root.style.setProperty("--racing-layout-zebra", (hit && hit.css) || "#f4f6f9");
  }

  function syncDateControls() {
    const all = !!(allRecords && allRecords.checked);
    if (dateInput) dateInput.disabled = all;
    if (btnPrevDay) btnPrevDay.disabled = all;
    if (btnNextDay) btnNextDay.disabled = all;
  }

  function shiftDate(days) {
    if (!dateInput || dateInput.disabled) return;
    const raw = dateInput.value || "";
    const base = raw ? new Date(raw + "T00:00:00") : new Date();
    if (Number.isNaN(base.getTime())) return;
    base.setDate(base.getDate() + days);
    const y = base.getFullYear();
    const m = String(base.getMonth() + 1).padStart(2, "0");
    const d = String(base.getDate()).padStart(2, "0");
    dateInput.value = y + "-" + m + "-" + d;
    if (listCtrl) listCtrl.load({ resetPage: true, n: 1 });
  }

  function visibleColumns() {
    return ((layoutSaved && layoutSaved.columns) || []).filter(function (c) {
      return c && c.visible;
    });
  }

  function renderTable(rows) {
    if (!thead || !tbody) return;
    thead.innerHTML = "";
    tbody.innerHTML = "";
    const cols = visibleColumns();
    const hr = document.createElement("tr");
    cols.forEach(function (c) {
      const th = document.createElement("th");
      th.dataset.key = c.key;
      th.textContent = RH.headerLabel(c, COL_LABEL);
      const w = c.width || 100;
      th.style.minWidth = w + "px";
      th.style.width = w + "px";
      hr.appendChild(th);
    });
    thead.appendChild(hr);
    RH.bindHeaderClicks({
      root: thead,
      onCycle: function (key) {
        if (listCtrl) listCtrl.cycleHeaderSort(key);
      },
    });
    RH.bindHeaderResize({
      root: thead,
      widthMin: WIDTH_MIN,
      widthMax: WIDTH_MAX,
      onCommit: function (key, width) {
        if (listCtrl) listCtrl.setColumnWidth(key, width);
      },
    });
    rows.forEach(function (row, idx) {
      const tr = document.createElement("tr");
      if (layoutSaved && layoutSaved.zebra_enabled && idx % 2 === 1) {
        tr.style.background =
          getComputedStyle(root).getPropertyValue("--racing-layout-zebra") || "#f4f6f9";
      }
      cols.forEach(function (c) {
        const td = document.createElement("td");
        td.textContent = row[c.key] != null && row[c.key] !== "" ? row[c.key] : "—";
        const w = c.width || 100;
        td.style.minWidth = w + "px";
        td.style.width = w + "px";
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  }

  rebuildSortable();
  applyZebraCss();

  listCtrl = window.HppvRecordsShell.createList({
    recordsUrl: "/api/records/racing/racing_standard_times",
    pagerMode: "page",
    els: {
      state: stateBox,
      tableWrap: tableWrap,
      searchInput: searchInput,
      searchOp: searchOp,
      pagerStatus: pagerStatus,
      pagerFirst: document.getElementById("racing-std-pager-first"),
      pagerPrev: document.getElementById("racing-std-pager-prev"),
      pagerNext: document.getElementById("racing-std-pager-next"),
      pagerLast: document.getElementById("racing-std-pager-last"),
    },
    messages: {
      loading: MSG.loading,
      empty: MSG.empty,
      error: MSG.error,
      retry: MSG.retry,
    },
    formatPagerStatus: function (api) {
      const tp = api.totalPages > 0 ? api.totalPages : 0;
      const n = tp > 0 ? api.pageN : 0;
      return n + "頁 / " + tp + " · " + (api.totalCount || 0) + "筆";
    },
    getLayout: function () { return layoutSaved; },
    getDraftLayout: function () { return layoutDraft; },
    getSortableMap: function () { return SORTABLE; },
    widthMin: WIDTH_MIN,
    widthMax: WIDTH_MAX,
    buildParams: function () {
      syncDateControls();
      const params = new URLSearchParams();
      const all = !!(allRecords && allRecords.checked);
      params.set("all_matches", all ? "1" : "0");
      if (!all && dateInput && dateInput.value) params.set("date", dateInput.value);
      return params;
    },
    normalizeResponse: function (data) {
      return {
        n: data.n,
        totalPages: data.total_pages,
        totalCount: data.total_count,
        q: data.q,
        qOp: data.q_op,
        sort: data.sort,
      };
    },
    onSuccess: function (data) {
      if (data.layout_settings) {
        layoutSaved = data.layout_settings;
        layoutDraft = JSON.parse(JSON.stringify(layoutSaved));
      }
      if (Array.isArray(data.catalog) && data.catalog.length) {
        catalog = data.catalog;
        rebuildSortable();
      }
      if (data && data.all_matches === false && data.date && dateInput && !dateInput.value) {
        dateInput.value = data.date;
      }
    },
    afterLayoutSync: function (data) {
      if (layoutEditor) layoutEditor.replaceSettings(layoutSaved);
      applyZebraCss();
      if (data && data.rows && data.rows.length) renderTable(data.rows);
    },
    persistLayoutSort: async function (layout) {
      const resp = await fetch("/api/layout/racing/racing_standard_times", {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify({ layout_settings: layout }),
      });
      const body = await resp.json();
      if (!resp.ok || !body.ok) throw new Error((body && body.error) || "save_failed");
      layoutSaved = body.layout_settings;
      layoutDraft = JSON.parse(JSON.stringify(layoutSaved));
      if (Array.isArray(body.catalog)) {
        catalog = body.catalog;
        rebuildSortable();
      }
      if (layoutEditor) layoutEditor.replaceSettings(layoutSaved);
      return layoutSaved;
    },
  });

  layoutEditor = window.HppvLayoutEditor.create({
    ids: {
      mode: "racing-std-layout-mode",
      openBtn: "racing-std-btn-open-layout",
      cancelBtn: "racing-std-layout-cancel",
      saveBtn: "racing-std-layout-save",
      colsBody: "racing-std-layout-cols-body",
      zebraColor: "racing-std-layout-zebra-color",
      zebraEnable: "racing-std-layout-zebra-enable",
      status: "racing-std-layout-status",
      toast: "racing-std-layout-toast",
      listMode: "racing-std-list-mode",
    },
    messages: {
      sortEmpty: MSG.layoutSortEmpty,
      sortAsc: MSG.layoutSortAsc,
      sortDesc: MSG.layoutSortDesc,
      sortUnsupported: MSG.sortUnsupported,
      moveUp: MSG.layoutMoveUp,
      moveDown: MSG.layoutMoveDown,
      widthInvalid: MSG.layoutWidthInvalid,
      saveOk: MSG.layoutSaved,
      saveFail: MSG.layoutSaveFailed,
    },
    colLabels: COL_LABEL,
    colDescs: COL_DESC,
    sortableMap: SORTABLE,
    zebraColors: ZEBRA_COLORS,
    widthMin: WIDTH_MIN,
    widthMax: WIDTH_MAX,
    locale: document.documentElement.lang || "zh-Hant",
    initialSettings: layoutSaved,
    autoBind: { open: true, cancel: true, save: true, zebra: true },
    applyZebraCss: applyZebraCss,
    onModeChange: function (on) {
      layoutModeOpen = !!on;
      root.classList.toggle("is-layout-mode", layoutModeOpen);
      panel.classList.toggle("matches-mode-layout", layoutModeOpen);
      panel.classList.toggle("matches-mode-list", !layoutModeOpen);
    },
    save: async function (draft) {
      const resp = await fetch("/api/layout/racing/racing_standard_times", {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify({ layout_settings: draft }),
      });
      const data = await resp.json();
      if (!resp.ok || !data || !data.ok) {
        throw new Error((data && data.error) || "save_failed");
      }
      layoutSaved = data.layout_settings;
      layoutDraft = JSON.parse(JSON.stringify(layoutSaved));
      if (Array.isArray(data.catalog)) {
        catalog = data.catalog;
        rebuildSortable();
      }
      return layoutSaved;
    },
    onAfterSave: async function () {
      await listCtrl.load({ resetPage: true, n: 1 });
    },
  });

  async function ensureLoaded() {
    if (!loaded) {
      loaded = true;
      await listCtrl.load({ n: 1 });
    }
  }

  window.__hppvRacingStdEnsureLoaded = ensureLoaded;
  window.__hppvRacingStdSetLayoutMode = function (on) {
    if (layoutEditor && typeof layoutEditor.setMode === "function") {
      layoutEditor.setMode(!!on);
    }
  };

  if (allRecords) {
    allRecords.addEventListener("change", function () {
      syncDateControls();
      if (listCtrl) listCtrl.load({ resetPage: true, n: 1 });
    });
  }
  if (dateInput) {
    dateInput.addEventListener("change", function () {
      if (listCtrl) listCtrl.load({ resetPage: true, n: 1 });
    });
  }
  if (btnPrevDay) btnPrevDay.addEventListener("click", function () { shiftDate(-1); });
  if (btnNextDay) btnNextDay.addEventListener("click", function () { shiftDate(1); });
  syncDateControls();
})();
</script>
