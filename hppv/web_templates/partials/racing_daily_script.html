  const COL_LABEL = {

    race_class: {{ t('racing.daily.col.race_class')|tojson }},
  };
  const COL_DESC = {
    id: {{ t('racing.daily.col.desc.id')|tojson }},
    race_date: {{ t('racing.daily.col.desc.race_date')|tojson }},
    racecourse: {{ t('racing.daily.col.desc.racecourse')|tojson }},
    racecourse_name: {{ t('racing.daily.col.desc.racecourse_name')|tojson }},
    race_no: {{ t('racing.daily.col.desc.race_no')|tojson }},
    reserve: {{ t('racing.daily.col.desc.reserve')|tojson }},
    horse_id: {{ t('racing.daily.col.desc.horse_id')|tojson }},
    horse_no: {{ t('racing.daily.col.desc.horse_no')|tojson }},
    horse_name: {{ t('racing.daily.col.desc.horse_name')|tojson }},
    draw: {{ t('racing.daily.col.desc.draw')|tojson }},
    jockey: {{ t('racing.daily.col.desc.jockey')|tojson }},
    trainer: {{ t('racing.daily.col.desc.trainer')|tojson }},
    handicap: {{ t('racing.daily.col.desc.handicap')|tojson }},
    rating: {{ t('racing.daily.col.desc.rating')|tojson }},
    horse_weight: {{ t('racing.daily.col.desc.horse_weight')|tojson }},
    gear: {{ t('racing.daily.col.desc.gear')|tojson }},
    predicted_odds: {{ t('racing.daily.col.desc.predicted_odds')|tojson }},
    immediate_odds: {{ t('racing.daily.col.desc.immediate_odds')|tojson }},
    event_name: {{ t('racing.daily.col.desc.event_name')|tojson }},
    calendar_date: {{ t('racing.daily.col.desc.calendar_date')|tojson }},
    weekday: {{ t('racing.daily.col.desc.weekday')|tojson }},
    meeting_venue: {{ t('racing.daily.col.desc.meeting_venue')|tojson }},
    post_time: {{ t('racing.daily.col.desc.post_time')|tojson }},
    race_course_area: {{ t('racing.daily.col.desc.race_course_area')|tojson }},
    track_name: {{ t('racing.daily.col.desc.track_name')|tojson }},
    distance: {{ t('racing.daily.col.desc.distance')|tojson }},
    prize_money: {{ t('racing.daily.col.desc.prize_money')|tojson }},

    race_class: {{ t('racing.daily.col.desc.race_class')|tojson }},
  };
  const ZEBRA_COLORS = {{ layout_zebra_colors|tojson }};
  const matchesPanel = document.getElementById("racing-tab-panel-matches");
  const raceCardsEl = document.getElementById("racing-daily-race-cards");
  const summaryEl = document.getElementById("racing-daily-summary");
  const horseIconTpl = document.getElementById("racing-daily-horse-icon-template");
  let layoutSaved = {{ racing_daily_layout_settings|tojson }};
  let layoutDraft = JSON.parse(JSON.stringify(layoutSaved));
  let catalog = {{ (racing_daily_layout_catalog if racing_daily_layout_catalog is defined else [])|tojson }};
  let meeting = null;
  let races = [];
  let selectedRaceNo = null;
  let lastRaceSummary = null;
  let listCtrl = null;
  let dailyLayoutEditor = null;
  let loaded = false;
  const SORTABLE = {};

  // Align with soccer history: catalog.sortable gates header + layout-editor sort.
  function rebuildSortable() {
    Object.keys(SORTABLE).forEach((k) => delete SORTABLE[k]);
    ((layoutSaved && layoutSaved.columns) || []).forEach((c) => { SORTABLE[c.key] = true; });
    (catalog || []).forEach((c) => { SORTABLE[c.key] = !!c.sortable; });
  }
  rebuildSortable();

  const stateBox = document.getElementById("racing-daily-state");
  const tableWrap = document.getElementById("racing-daily-table-wrap");
  const thead = document.getElementById("racing-daily-thead");
  const tbody = document.getElementById("racing-daily-tbody");

  function readSavedSelection() {
    try {
      const raw = sessionStorage.getItem(SEL_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (_e) { return null; }
  }
  function writeSavedSelection() {
    if (!meeting || selectedRaceNo == null) return;
    try {
      sessionStorage.setItem(SEL_KEY, JSON.stringify({
        race_date: meeting.race_date,
        racecourse: meeting.racecourse,
        race_no: selectedRaceNo,
      }));
    } catch (_e) {}
  }

  function visibleColumns() {
    return ((layoutSaved && layoutSaved.columns) || []).filter((c) => c.visible);
  }

  function applyZebraCss(settings) {
    const src = settings || layoutSaved;
    if (!src || !src.zebra_enabled) {
      root.style.removeProperty("--racing-layout-zebra");
      return;
    }
    const found = ZEBRA_COLORS.find((c) => c.id === src.zebra_color_id);
    if (found) root.style.setProperty("--racing-layout-zebra", found.css);
  }

  function raceLabel(n) {
    return String(MSG.raceCardLabel).replace("{n}", String(n));
  }

  function renderRaceCards() {
    if (!raceCardsEl) return;
    raceCardsEl.innerHTML = "";
    races.forEach((r) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "racing-daily-race-card";
      btn.textContent = String(r.race_no);
      btn.setAttribute("role", "tab");
      btn.setAttribute("aria-selected", r.race_no === selectedRaceNo ? "true" : "false");
      btn.setAttribute("aria-label", raceLabel(r.race_no));
      btn.title = raceLabel(r.race_no);
      btn.addEventListener("click", () => {
        if (r.race_no === selectedRaceNo) return;
        selectedRaceNo = r.race_no;
        writeSavedSelection();
        if (listCtrl) listCtrl.load();
      });
      raceCardsEl.appendChild(btn);
    });
  }

  function appendSummaryPart(label, value) {
    if (!summaryEl) return;
    const wrap = document.createElement("span");
    const lab = document.createElement("span");
    lab.className = "sum-label";
    lab.textContent = label + "：";
    const val = document.createElement("span");
    val.className = "sum-value";
    val.textContent = value || "—";
    wrap.appendChild(lab);
    wrap.appendChild(val);
    if (summaryEl.childNodes.length) {
      const sep = document.createElement("span");
      sep.className = "sep";
      sep.textContent = "｜";
      summaryEl.appendChild(sep);
    }
    summaryEl.appendChild(wrap);
  }

  function renderSummary(summary) {
    if (!summaryEl) return;
    summaryEl.innerHTML = "";
    lastRaceSummary = summary || null;
    if (!summary) return;
    const raceNoTxt = summary.race_no != null ? raceLabel(summary.race_no) : "—";
    appendSummaryPart(SUM_LABEL.race_no, raceNoTxt);
    appendSummaryPart(SUM_LABEL.race_date, summary.race_date || "—");
    appendSummaryPart(SUM_LABEL.post_time, summary.post_time || "—");
    appendSummaryPart(SUM_LABEL.venue, summary.racecourse_name || summary.meeting_venue || "—");
    appendSummaryPart(SUM_LABEL.race_class, summary.race_class || "—");
    appendSummaryPart(SUM_LABEL.distance, summary.distance || "—");
    appendSummaryPart(SUM_LABEL.surface, summary.race_course_area || "—");
    appendSummaryPart(SUM_LABEL.track, summary.track_name || "—");
    appendSummaryPart(SUM_LABEL.going, summary.going || "—");
    if (summary.event_name && summary.event_name !== "—") {
      appendSummaryPart(SUM_LABEL.event_name, summary.event_name);
    }
  }

  function horseIconNode() {
    if (horseIconTpl && horseIconTpl.content) {
      const node = horseIconTpl.content.firstElementChild.cloneNode(true);
      if (node && node.classList) node.classList.add("racing-daily-horse-icon");
      return node;
    }
    throw new Error("racing daily horse icon template missing");
  }

  // ---- Horse form accordion (mirrors soccer match-form) ----
  let horseFormOpenKey = null;
  let horseFormFetchSeq = 0;
  const horseFormCache = Object.create(null);
  const horseFormFilters = { limit: 10, recent_filter: "all" };

  function hfEsc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function horseFormRowKey(row) {
    return [
      row.horse_id || "",
      meeting && (meeting.race_date_iso || meeting.race_date) || "",
      meeting && meeting.racecourse || "",
      selectedRaceNo != null ? String(selectedRaceNo) : "",
      row.horse_no || "",
    ].join("|");
  }

  function closeHorseFormPanels() {
    horseFormOpenKey = null;
    document.querySelectorAll("tr.horse-form-expand").forEach((el) => el.remove());
    document.querySelectorAll(".racing-daily-horse-icon.is-open").forEach((btn) => {
      btn.classList.remove("is-open");
      btn.setAttribute("aria-expanded", "false");
    });
  }

  function hfSelectHtml(key, value, options) {
    let html = '<label>' + hfEsc(MSG.horseFormLimit) +
      ' <select data-hf-key="' + hfEsc(key) + '">';
    options.forEach((opt) => {
      html += '<option value="' + hfEsc(opt.value) + '"' +
        (String(opt.value) === String(value) ? " selected" : "") + ">" +
        hfEsc(opt.label) + "</option>";
    });
    return html + "</select></label>";
  }

  function hfFilterSelectHtml(value) {
    const opts = [
      { value: "all", label: MSG.horseFormFilterAll },
      { value: "same_venue", label: MSG.horseFormFilterVenue },
      { value: "same_distance", label: MSG.horseFormFilterDistance },
    ];
    let html = '<label><select data-hf-key="recent_filter">';
    opts.forEach((opt) => {
      html += '<option value="' + hfEsc(opt.value) + '"' +
        (opt.value === value ? " selected" : "") + ">" + hfEsc(opt.label) + "</option>";
    });
    return html + "</select></label>";
  }

  function hfFormTableHtml(rows) {
    const list = rows || [];
    const heads = [
      MSG.horseFormColDate, MSG.horseFormColVenue, MSG.horseFormColDistance,
      MSG.horseFormColClass, MSG.horseFormColDraw, MSG.horseFormColHandicap,
      MSG.horseFormColJockey, MSG.horseFormColFinish,
      MSG.horseFormColRunning, MSG.horseFormColTime, MSG.horseFormColOdds,
    ];
    let html = '<div class="hf-table-scroll"><table class="hf-table"><thead><tr>';
    heads.forEach((h) => { html += "<th>" + hfEsc(h) + "</th>"; });
    html += "</tr></thead><tbody>";
    if (!list.length) {
      html += '<tr><td colspan="11"><div class="hf-state">' + hfEsc(MSG.horseFormEmpty) +
        "</div></td></tr>";
    } else {
      list.forEach((r) => {
        html += "<tr>" +
          "<td>" + hfEsc(r.race_date) + "</td>" +
          "<td>" + hfEsc(r.venue) + "</td>" +
          "<td>" + hfEsc(r.distance) + "</td>" +
          "<td>" + hfEsc(r.class_band) + "</td>" +
          "<td>" + hfEsc(r.draw) + "</td>" +
          "<td>" + hfEsc(r.handicap) + "</td>" +
          "<td>" + hfEsc(r.jockey) + "</td>" +
          "<td>" + hfEsc(r.finish_pos) + "</td>" +
          "<td>" + hfEsc(r.running_pos) + "</td>" +
          "<td>" + hfEsc(r.time) + "</td>" +
          "<td>" + hfEsc(r.win_odds) + "</td>" +
          "</tr>";
      });
    }
    html += "</tbody></table></div>";
    return html;
  }

  function hfRateText(rate) {
    if (rate == null || rate === "" || rate === "—") return "—";
    const n = Number(rate);
    if (!Number.isFinite(n)) return "—";
    return (n * 100).toFixed(1) + "%";
  }

  function hfStatChip(text, cls) {
    return '<span class="hf-stat-chip' + (cls ? " " + cls : "") + '">' + hfEsc(text) + "</span>";
  }

  function hfSummaryCardHtml(summary, limit) {
    const s = summary || {};
    const playedOf = String(MSG.horseFormPlayedOf || "").replace("{total}", String(limit || s.played || 0));
    const noValid = !(s.valid_played > 0);
    return '<div class="hf-summary-card"><h5>' + hfEsc(MSG.horseFormSummary) + "</h5>" +
      '<div class="hf-stat-chips">' +
      hfStatChip(MSG.horseFormStatFirst + " " + (s.first || 0), "is-first") +
      hfStatChip(MSG.horseFormStatSecond + " " + (s.second || 0), "is-second") +
      hfStatChip(MSG.horseFormStatThird + " " + (s.third || 0), "is-third") +
      hfStatChip(MSG.horseFormStatOther + " " + (s.other || 0), "") +
      hfStatChip(MSG.horseFormStatWithdrawn + " " + (s.withdrawn || 0), "is-withdrawn") +
      (s.unknown ? hfStatChip(MSG.horseFormStatUnknown + " " + s.unknown, "") : "") +
      "</div>" +
      "<p>" + hfEsc(MSG.horseFormStatWinRate) + " " + hfEsc(hfRateText(s.win_rate)) +
      " ｜ " + hfEsc(MSG.horseFormStatPlaceRate) + " " + hfEsc(hfRateText(s.place_rate)) + "</p>" +
      "<p>" + hfEsc(MSG.horseFormStatValid) + " " + hfEsc(s.valid_played || 0) +
      hfEsc(playedOf) +
      (noValid ? " · " + hfEsc(MSG.horseFormStatNoValid) : "") +
      "</p></div>";
  }

  function renderHorseFormPanelContent(host, state) {
    if (!host) return;
    if (state === "loading") {
      host.innerHTML = '<div class="horse-form-panel"><div class="hf-state">' +
        hfEsc(MSG.horseFormLoading) + "</div></div>";
      return;
    }
    if (state && state.error) {
      host.innerHTML = '<div class="horse-form-panel"><div class="hf-state error">' +
        hfEsc(MSG.horseFormError) +
        ' <button type="button" class="date-nav-btn" data-hf-retry="1">' +
        hfEsc(MSG.horseFormRetry) + "</button></div></div>";
      const btn = host.querySelector("[data-hf-retry]");
      if (btn) btn.addEventListener("click", () => loadHorseForm(host, true));
      return;
    }
    const data = state && state.data ? state.data : {};
    const f = Object.assign({}, horseFormFilters, (data.filters || {}));
    if (data.limit) f.limit = data.limit;
    const name = (data.horse && data.horse.horse_name) || "";
    host.innerHTML =
      '<div class="horse-form-panel" data-horse-id="' + hfEsc((data.horse && data.horse.horse_id) || "") + '">' +
      '<div class="hf-head"><h4 class="hf-title">' + hfEsc(MSG.horseFormTitle) +
      (name ? " — " + hfEsc(name) : "") + "</h4>" +
      '<span class="hf-cutoff">' + hfEsc(MSG.horseFormCutoff) + "</span>" +
      hfSelectHtml("limit", f.limit, [{ value: 5, label: "5" }, { value: 10, label: "10" }]) +
      "</div>" +
      '<div class="hf-section"><h5 class="hf-section-title">1. ' + hfEsc(MSG.horseFormSameDistance) + "</h5>" +
      hfFormTableHtml(data.same_distance) + "</div>" +
      '<div class="hf-section"><h5 class="hf-section-title">2. ' + hfEsc(MSG.horseFormRecent) + "</h5>" +
      '<div class="hf-toolbar">' + hfFilterSelectHtml(f.recent_filter || "all") + "</div>" +
      hfFormTableHtml(data.recent) + "</div>" +
      '<div class="hf-section"><h5 class="hf-section-title">3. ' + hfEsc(MSG.horseFormSummary) + "</h5>" +
      '<div class="hf-summary">' + hfSummaryCardHtml(data.summary, f.limit) + "</div></div>" +
      "</div>";
    host.querySelectorAll("[data-hf-key]").forEach((el) => {
      el.addEventListener("change", () => {
        const key = el.getAttribute("data-hf-key");
        if (key === "limit") horseFormFilters.limit = Number(el.value) || 10;
        else if (key === "recent_filter") horseFormFilters.recent_filter = el.value || "all";
        loadHorseForm(host, true);
      });
    });
  }

  async function loadHorseForm(host, force) {
    if (!host) return;
    const anchor = host._hfAnchor;
    if (!anchor || !anchor.horse_id) return;
    const cacheKey = JSON.stringify({ a: anchor, f: horseFormFilters });
    if (!force && horseFormCache[cacheKey]) {
      renderHorseFormPanelContent(host, { data: horseFormCache[cacheKey] });
      return;
    }
    const seq = ++horseFormFetchSeq;
    renderHorseFormPanelContent(host, "loading");
    const params = new URLSearchParams();
    params.set("horse_id", anchor.horse_id);
    params.set("race_date", anchor.race_date);
    params.set("venue", anchor.venue || "");
    params.set("distance", anchor.distance || "");
    if (anchor.race_no) params.set("race_no", String(anchor.race_no));
    if (anchor.horse_name) params.set("horse_name", anchor.horse_name);
    params.set("limit", String(horseFormFilters.limit));
    params.set("recent_filter", horseFormFilters.recent_filter);
    try {
      const resp = await fetch("/api/racing/horse-form?" + params.toString(), {
        headers: { Accept: "application/json" },
      });
      const body = await resp.json();
      if (seq !== horseFormFetchSeq) return;
      if (!resp.ok || !body || !body.ok) {
        renderHorseFormPanelContent(host, { error: true });
        return;
      }
      horseFormCache[cacheKey] = body.data;
      renderHorseFormPanelContent(host, { data: body.data });
    } catch (_e) {
      if (seq !== horseFormFetchSeq) return;
      renderHorseFormPanelContent(host, { error: true });
    }
  }

  function toggleHorseForm(tr, row, btn) {
    const key = horseFormRowKey(row);
    const existing = tr.nextElementSibling;
    if (existing && existing.classList.contains("horse-form-expand") && horseFormOpenKey === key) {
      closeHorseFormPanels();
      return;
    }
    closeHorseFormPanels();
    horseFormOpenKey = key;
    btn.classList.add("is-open");
    btn.setAttribute("aria-expanded", "true");
    const expand = document.createElement("tr");
    expand.className = "horse-form-expand";
    const td = document.createElement("td");
    td.colSpan = tr.children.length;
    const host = document.createElement("div");
    host.className = "horse-form-panel-host";
    const venue = row.racecourse_name || row.meeting_venue ||
      (lastRaceSummary && (lastRaceSummary.racecourse_name || lastRaceSummary.meeting_venue)) ||
      (meeting && meeting.racecourse_name) || "";
    const distance = row.distance || (lastRaceSummary && lastRaceSummary.distance) || "";
    host._hfAnchor = {
      horse_id: row.horse_id || "",
      race_date: (meeting && (meeting.race_date_iso || meeting.race_date)) || row.race_date || "",
      venue: venue,
      distance: distance,
      race_no: selectedRaceNo != null ? String(selectedRaceNo) : (row.race_no || ""),
      horse_name: row.horse_name || "",
    };
    td.appendChild(host);
    expand.appendChild(td);
    tr.after(expand);
    loadHorseForm(host, false);
  }

  function renderTable(rows) {
    applyZebraCss(layoutSaved);
    closeHorseFormPanels();
    const cols = visibleColumns();
    thead.innerHTML = "";
    tbody.innerHTML = "";
    const hr = document.createElement("tr");
    const thIcon = document.createElement("th");
    thIcon.className = "racing-daily-icon-col";
    thIcon.textContent = "";
    thIcon.setAttribute("aria-label", MSG.horseTip);
    hr.appendChild(thIcon);
    if (!window.HppvRecordsHeader) throw new Error("racing daily requires HppvRecordsHeader");
    const RH = window.HppvRecordsHeader;
    cols.forEach((c) => {
      const th = document.createElement("th");
      th.dataset.key = c.key;
      th.textContent = RH.headerLabel(c, COL_LABEL);
      const w = c.width || 100;
      th.style.minWidth = w + "px";
      th.style.width = w + "px";
      hr.appendChild(th);
    });
    thead.appendChild(hr);
    RH.bindHeaderClicks({
      root: thead,
      onCycle: function (key) {
        if (listCtrl) listCtrl.cycleHeaderSort(key);
      },
    });
    RH.bindHeaderResize({
      root: thead,
      widthMin: WIDTH_MIN,
      widthMax: WIDTH_MAX,
      onCommit: function (key, width) {
        if (listCtrl) listCtrl.setColumnWidth(key, width);
      },
    });
    rows.forEach((row, idx) => {
      const tr = document.createElement("tr");
      if (layoutSaved && layoutSaved.zebra_enabled && idx % 2 === 1) {
        tr.style.background = getComputedStyle(root).getPropertyValue("--racing-layout-zebra") || "#f4f6f9";
      }
      const tdIcon = document.createElement("td");
      tdIcon.className = "racing-daily-icon-col";
      const icon = horseIconNode();
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "racing-daily-horse-icon";
      btn.title = MSG.horseTip;
      btn.setAttribute("aria-label", MSG.horseTip);
      btn.setAttribute("aria-expanded", "false");
      if (icon && icon.tagName === "SVG") {
        btn.appendChild(icon);
      } else if (icon) {
        const svg = icon.querySelector ? icon.querySelector("svg") : null;
        if (svg) btn.appendChild(svg.cloneNode(true));
        else btn.appendChild(icon);
      }
      btn.addEventListener("click", (ev) => {
        ev.preventDefault();
        ev.stopPropagation();
        toggleHorseForm(tr, row, btn);
      });
      tdIcon.appendChild(btn);
      tr.appendChild(tdIcon);
      cols.forEach((c) => {
        const td = document.createElement("td");
        td.textContent = row[c.key] != null ? row[c.key] : "—";
        const w = c.width || 100;
        td.style.minWidth = w + "px";
        td.style.width = w + "px";
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  }

  listCtrl = window.HppvRecordsShell.createList({
    recordsUrl: "/api/records/racing/racing_daily",
    pagerMode: "none",
    autoBindSearch: false,
    autoBindPager: false,
    els: {
      state: stateBox,
      tableWrap: tableWrap,
    },
    messages: {
      loading: MSG.loading,
      empty: MSG.empty,
      error: MSG.error,
      retry: MSG.retry,
    },
    getLayout: function () { return layoutSaved; },
    getDraftLayout: function () { return layoutDraft; },
    getSortableMap: function () { return SORTABLE; },
    widthMin: WIDTH_MIN,
    widthMax: WIDTH_MAX,
    buildParams: function () {
      const params = new URLSearchParams();
      const saved = readSavedSelection();
      if (selectedRaceNo != null) params.set("race_no", String(selectedRaceNo));
      else if (saved && saved.race_no != null) params.set("race_no", String(saved.race_no));
      if (meeting) {
        params.set("date", meeting.race_date_iso || meeting.race_date);
        params.set("racecourse", meeting.racecourse);
      }
      return params;
    },
    normalizeResponse: function (data) {
      return { sort: data.sort, totalCount: (data.rows && data.rows.length) || 0 };
    },
    beforeFetch: function () {
      if (summaryEl) summaryEl.innerHTML = "";
      return true;
    },
    onSuccess: function (data) {
      if (data.layout_settings) {
        layoutSaved = data.layout_settings;
        layoutDraft = JSON.parse(JSON.stringify(layoutSaved));
      }
      if (Array.isArray(data.catalog) && data.catalog.length) {
        catalog = data.catalog;
        rebuildSortable();
      }
      meeting = data.meeting || null;
      races = Array.isArray(data.races) ? data.races : [];
      selectedRaceNo = data.selected_race_no;
      writeSavedSelection();
      renderRaceCards();
      renderSummary(data.summary || null);
      // Table render waits for afterLayoutSync (shell re-applies sort arrows first).
    },
    afterLayoutSync: function (data) {
      if (dailyLayoutEditor) dailyLayoutEditor.replaceSettings(layoutSaved);
      if (data && data.rows && data.rows.length) renderTable(data.rows);
    },
    persistLayoutSort: async function (layout) {
      const resp = await fetch("/api/layout/racing/racing_daily", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({ layout_settings: layout }),
      });
      const data = await resp.json();
      if (!resp.ok || !data || !data.ok) {
        throw new Error((data && data.error) || "save_failed");
      }
      layoutSaved = data.layout_settings;
      layoutDraft = JSON.parse(JSON.stringify(layoutSaved));
      if (Array.isArray(data.catalog)) {
        catalog = data.catalog;
        rebuildSortable();
      }
      if (dailyLayoutEditor) dailyLayoutEditor.replaceSettings(layoutSaved);
      return layoutSaved;
    },
  });

  dailyLayoutEditor = window.HppvLayoutEditor.create({
    ids: {
      mode: "racing-daily-layout-mode",
      openBtn: "racing-daily-open-layout",
      cancelBtn: "racing-daily-layout-cancel",
      saveBtn: "racing-daily-layout-save",
      colsBody: "racing-daily-layout-cols-body",
      zebraColor: "racing-daily-layout-zebra-color",
      zebraEnable: "racing-daily-layout-zebra-enable",
      status: "racing-daily-layout-status",
      toast: "racing-daily-layout-toast",
      listMode: "racing-daily-list-mode",
    },
    messages: {
      sortEmpty: MSG.layoutSortEmpty,
      sortAsc: MSG.layoutSortAsc,
      sortDesc: MSG.layoutSortDesc,
      sortUnsupported: MSG.sortUnsupported,
      moveUp: MSG.layoutMoveUp,
      moveDown: MSG.layoutMoveDown,
      widthInvalid: MSG.layoutWidthInvalid,
      saveOk: MSG.layoutSaved,
      saveFail: MSG.layoutSaveFailed,
    },
    colLabels: COL_LABEL,
    colDescs: COL_DESC,
    sortableMap: SORTABLE,
    zebraColors: ZEBRA_COLORS,
    widthMin: WIDTH_MIN,
    widthMax: WIDTH_MAX,
    locale: UI_LOCALE,
    initialSettings: layoutSaved,
    autoBind: { open: true, cancel: true, save: true, zebra: true },
    applyZebraCss: applyZebraCss,
    onModeChange: function (on) {
      root.classList.toggle("is-layout-mode", !!on || root.classList.contains("history-layout-open"));
      if (matchesPanel) {
        matchesPanel.classList.toggle("matches-mode-layout", !!on);
        matchesPanel.classList.toggle("matches-mode-list", !on);
      }
    },
    save: async function (draft) {
      const resp = await fetch("/api/layout/racing/racing_daily", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({ layout_settings: draft }),
      });
      const data = await resp.json();
      if (!resp.ok || !data || !data.ok) {
        throw new Error((data && data.error) || "save_failed");
      }
      layoutSaved = data.layout_settings;
      layoutDraft = JSON.parse(JSON.stringify(layoutSaved));
      if (Array.isArray(data.catalog)) {
        catalog = data.catalog;
        rebuildSortable();
      }
      return layoutSaved;
    },
    onAfterSave: async function () {
      await listCtrl.load();
    },
  });
  window.__racingDailySetLayoutMode = function (on) {
    if (on) {
      layoutDraft = JSON.parse(JSON.stringify(layoutSaved));
      dailyLayoutEditor.replaceSettings(layoutSaved);
    }
    dailyLayoutEditor.setMode(!!on);
  };

  window.__racingEnsureDailyLoaded = async function ensureDailyLoaded() {
    if (!catalog.length) {
      const resp = await fetch("/api/layout/racing/racing_daily");
      const data = await resp.json();
      if (resp.ok && data && data.ok) {
        layoutSaved = data.layout_settings;
        layoutDraft = JSON.parse(JSON.stringify(layoutSaved));
        catalog = data.catalog || [];
        rebuildSortable();
        dailyLayoutEditor.replaceSettings(layoutSaved);
      }
    }
    if (!loaded) {
      loaded = true;
      await listCtrl.load();
    }
  };

  const exportOverlay = document.getElementById("racing-daily-export-overlay");
  function openExport() {
    exportOverlay.hidden = false;
    exportOverlay.classList.add("show");
    document.getElementById("racing-daily-export-status").textContent = "";
  }
  function closeExport() {
    exportOverlay.classList.remove("show");
    exportOverlay.hidden = true;
  }
  async function doExport() {
    const status = document.getElementById("racing-daily-export-status");
    if (!meeting || selectedRaceNo == null) {
      status.textContent = MSG.exportNoRace;
      return;
    }
    const type = document.getElementById("racing-daily-export-type").value;
    let filename = document.getElementById("racing-daily-export-filename").value.trim() || ("racing_daily." + type);
    if (!filename.toLowerCase().endsWith("." + type)) filename += "." + type;
    const cols = visibleColumns().map((c) => ({ key: c.key, width: c.width || 100 }));
    status.textContent = MSG.loading;
    const raceBefore = selectedRaceNo;
    try {
      const resp = await fetch("/api/racing/daily-export", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({
          file_type: type,
          filename: filename,
          date: meeting.race_date_iso || meeting.race_date,
          racecourse: meeting.racecourse,
          race_no: selectedRaceNo,
          sort: listCtrl ? listCtrl.sortParam : "",
          columns: cols,
          lang: UI_LOCALE,
        }),
      });
      if (!resp.ok) {
        let err = MSG.exportFailed;
        try {
          const j = await resp.json();
          if (j && (j.error === "no_rows" || j.error === "no_selected_race")) err = MSG.exportNoRows;
          else if (j && j.error === "no_selected_race") err = MSG.exportNoRace;
          else if (j && j.error) err += "（" + j.error + "）";
        } catch (_e) {}
        status.textContent = err;
        return;
      }
      const blob = await resp.blob();
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      URL.revokeObjectURL(a.href);
      status.textContent = MSG.exportOk;
      selectedRaceNo = raceBefore;
      writeSavedSelection();
    } catch (_e) {
      status.textContent = MSG.exportFailed;
    }
  }

  document.getElementById("racing-daily-btn-open-export").addEventListener("click", openExport);
  document.getElementById("racing-daily-export-cancel").addEventListener("click", closeExport);
  document.getElementById("racing-daily-export-confirm").addEventListener("click", doExport);
  document.getElementById("racing-daily-export-type").addEventListener("change", (e) => {
    const t = e.target.value;
    const fn = document.getElementById("racing-daily-export-filename");
    fn.value = (fn.value.replace(/\.(xlsx|csv|pdf|jpeg)$/i, "") || "racing_daily") + "." + t;
  });

  const matchesActive = document.getElementById("racing-tab-panel-matches");
  if (matchesActive && matchesActive.classList.contains("active")) {
    window.__racingEnsureDailyLoaded();
  }
})();
</script>
